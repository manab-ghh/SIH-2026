name: frontend
description: "ShilpSetu AI - AI-Powered Digital Business Manager for Artisans"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  cached_network_image: ^3.4.1
  intl: any
  image_picker: ^1.1.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  animate_do: ^3.3.4
  fl_chart: ^0.70.2
  uuid: ^4.5.1
  image: ^4.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
